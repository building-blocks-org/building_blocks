default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: git@github.com:astral-sh/ruff-pre-commit.git
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: ["--config=pyproject.toml"]
      - id: ruff-format
        args: ["--config=pyproject.toml"]

  - repo: git@github.com:pre-commit/pre-commit-hooks.git
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        name: Check YAML
        entry: check-yaml
        args: ["--allow-multiple-documents", "--unsafe"]
      - id: check-added-large-files
        exclude: "^docs/assets/"
      - id: check-merge-conflict
      - id: debug-statements
        language_version: "3.14"
      - id: check-toml

  - repo: local
    hooks:
      - id: ci-simulate
        name: Run CI simulate
        entry: poetry run poe ci:simulate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: prevent-generated-mkdocs-nav
        name: Block generated autodoc nav in mkdocs.yml
        entry: "bash -c 'git show :mkdocs.yml 2>/dev/null | grep -q reference/autodoc && { echo \"[ERROR] mkdocs.yml contains generated autodoc nav (reference/autodoc). Restore via git show HEAD:mkdocs.yml > mkdocs.yml\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false
        files: ^mkdocs\.yml$
